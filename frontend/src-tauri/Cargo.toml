[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"   
windows = { version = "0.61.3", features = ["Devices_Radios", "Foundation", "Foundation_Collections", "Networking_Connectivity", "Networking_NetworkOperators"] }
screenshots = "0.8"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
base64 = "0.22"
# Gemini requests are proxied through Rust so the API key never enters the JS bundle.
# Version matches the reqwest tauri already pulls in, so no second copy is built.
# tauri enables it without a TLS backend, hence native-tls (schannel on Windows).
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }
